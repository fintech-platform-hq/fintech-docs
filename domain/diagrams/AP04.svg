<g id="AP04-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
<text x="255" y="146" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Entry</text>
</g>
<g id="AP04-v" data-kind="decision">
<path d="M275 236 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="244" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Is this a proved external</text>
<text x="249" y="260" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">revocation?</text>
<text x="249" y="226" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP04-e" data-kind="action">
<rect x="80" y="319" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="340" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Invalidate external proof. Zero methods may</text>
<text x="275" y="384" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">remain. Sessions follow LAC-01</text>
</g>
<g id="AP04-t" data-kind="decision">
<path d="M275 460 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="468" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Is the local goal sign-out?</text>
<text x="249" y="450" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Account holder</text>
</g>
<g id="AP04-l" data-kind="action">
<rect x="80" y="543" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="564" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="593" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">End local authority, hide data and intents, and</text>
<text x="275" y="608" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">preserve eligible protected intent</text>
</g>
<g id="AP04-m" data-kind="action">
<rect x="80" y="655" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="676" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="705" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Determine remote revocation separately. Reply loss</text>
<text x="275" y="720" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">leaves local access closed</text>
</g>
<g id="AP04-d" data-kind="decision">
<path d="M275 796 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="804" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Does another method remain</text>
<text x="249" y="820" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">usable at commitment?</text>
<text x="249" y="786" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP04-c" data-kind="action">
<rect x="80" y="879" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="900" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="929" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Unlink and handle sessions under LAC-01. Reply</text>
<text x="275" y="944" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">loss goes to AP15</text>
</g>
<g id="AP04-r" data-kind="action">
<rect x="80" y="991" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="1012" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="1041" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Show remaining authorized methods and preserve</text>
<text x="275" y="1056" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">existing links</text>
</g>
<g id="AP04-m_z" data-kind="merge">
<path d="M275 1132 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="1122" fill="#556982" font-size="12" font-weight="700" text-anchor="end"></text>
</g>
<g id="AP04-z" data-kind="final">
<circle cx="275" cy="1260" r="12" fill="#ffffff" stroke="#162d43" stroke-width="2"/>
<circle cx="275" cy="1260" r="7" fill="#162d43"/>
<text x="255" y="1266" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">End</text>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Is this a proved external revocation?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[External revocation confirmed]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Is this a proved external revocation?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Authorized local action]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Is the local goal sign-out?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Sign out]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Is the local goal sign-out?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Unlink method]</text>
<text x="725" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Does another method remain usable at commitment?</text>
<text x="739" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Yes, with valid proof and account]</text>
<text x="725" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Does another method remain usable at commitment?</text>
<text x="739" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[No or concurrent act won]</text>
</g></svg>
