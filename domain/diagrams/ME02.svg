<g id="ME02-05" data-from="a" data-to="a"><path d="M 470 241 H 506 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="509" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="511" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">05</text></g>
<g id="ME02-06" data-from="b" data-to="b"><path d="M 470 353 H 528 V 375 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,375 479,371 479,379" fill="#536783"/><rect x="531" y="348" width="22" height="16" rx="3" fill="#fff"/><text x="533" y="361" fill="#536783" font-size="12" font-weight="700" text-anchor="start">06</text></g>
<g id="ME02-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME02-a" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Linked</text>
</g>
<g id="ME02-b" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Externally revoked</text>
</g>
<g id="ME02-f" data-kind="final">
<circle cx="275" cy="476" r="12" fill="#ffffff" stroke="#162d43" stroke-width="2"/>
<circle cx="275" cy="476" r="7" fill="#162d43"/>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Establish method</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Eligible registration or consent, both proofs and exclusivity establish the method</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">for the same holder. ME03 gates password financial access.</text>
<text x="725" y="207" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Recognize external revocation</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Valid provider evidence removes usability. Zero usable methods can remain.</text>
<text x="725" y="258" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Unlink active method</text>
<text x="739" y="278" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Check another usable method at commitment, then end the link and handle affected</text>
<text x="739" y="297" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">sessions. A future link starts its own lifecycle.</text>
<text x="725" y="328" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Unlink revoked method</text>
<text x="739" y="348" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Apply the same remaining-method guard. Remove the revoked link and retain</text>
<text x="739" y="367" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">authorship and exclusivity.</text>
<text x="725" y="398" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Refuse unlinking active method</text>
<text x="739" y="418" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Insufficient proof or no other usable method preserves links. Return current</text>
<text x="739" y="437" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">authorized state.</text>
<text x="725" y="468" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Refuse unlinking revoked method</text>
<text x="739" y="488" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Inadequate proof or no other usable method grants no new authority. Recover only</text>
<text x="739" y="507" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">with existing eligible proof.</text>
</g></svg>
