<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="580" viewBox="0 0 1430 580" role="img" aria-labelledby="titulo">
<title id="titulo">ME02 · Sign-in method linkage</title>
<rect width="1430" height="580" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="48" y="36" fill="#526f83" font-size="14" font-weight="700" text-anchor="start">LENVER / MF03.1     STATE MACHINE</text>
<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME02 · Sign-in method linkage</text>
<line x1="702" y1="101" x2="702" y2="542" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
<g id="ME02-01" data-from="i" data-to="a"><path d="M 275 153 V 223" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,228 271,219 279,219" fill="#12605c"/><rect x="284" y="187" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="200" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">01</text></g>
