<text x="249" y="388" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">applicable?</text>
<text x="249" y="338" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP11-q" data-kind="decision">
<path d="M275 460 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="468" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Can an existing occurrence</text>
<text x="249" y="484" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">be refined for the new T0?</text>
<text x="249" y="450" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP11-p" data-kind="action">
