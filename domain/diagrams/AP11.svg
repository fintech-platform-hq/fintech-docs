<text x="275" y="228" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Account holder</text>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Request suspension or declare new terms with</text>
<text x="275" y="272" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">reason, contextual proof and confirmation</text>
