<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Authority and preview valid with unambiguous terms when applicable?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Reauthenticated holder, reason, expected revision and clear boundaries]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Authority and preview valid with unambiguous terms when applicable?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Missing authority, conflict or ambiguous interval]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Can an existing occurrence be refined for the new T0?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Authorized AP08 refinement even under suspension]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Can an existing occurrence be refined for the new T0?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[No eligible refinement or defer]</text>
