<text x="275" y="1041" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Reject or defer, preserve terms and suppress</text>
<text x="275" y="1056" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">invalid derivatives</text>
