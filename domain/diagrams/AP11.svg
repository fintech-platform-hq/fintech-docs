<text x="275" y="929" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Receive AP12 result, reread eligible figures and</text>
<text x="275" y="944" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">keep original comparisons</text>
</g>
