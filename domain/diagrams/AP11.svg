<text x="275" y="564" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="593" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Ask for precision or defer. Keep suspension and</text>
<text x="275" y="608" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">preview the new revision</text>
</g>
<g id="AP11-c" data-kind="action">
<rect x="80" y="655" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="676" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Account holder</text>
<text x="275" y="705" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Review impact and confirm protected original</text>
<text x="275" y="720" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">through AP12</text>
</g>
<g id="AP11-g" data-kind="action">
<rect x="80" y="767" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="788" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="817" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">AP12 preserves terms in suspension or commits a</text>
<text x="275" y="832" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">new version. Moving T0 gives no attribution</text>
</g>
