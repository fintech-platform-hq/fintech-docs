<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Request only the original result with proof</text>
<text x="275" y="272" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">established before transmission</text>
