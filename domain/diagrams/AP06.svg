<text x="249" y="388" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">environment?</text>
<text x="249" y="338" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP06-d" data-kind="decision">
