<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Valid proof for original request, holder and environment?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Yes, including invalidated session]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Valid proof for original request, holder and environment?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Absent, other scope, expired or unproved]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Authoritative outcome for the original?</text>
