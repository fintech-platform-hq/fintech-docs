<text x="275" y="788" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="817" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Refuse disclosure and preserve current session</text>
<text x="275" y="832" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">scope</text>
