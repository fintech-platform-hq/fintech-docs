<text x="275" y="593" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Show minimum protected result and disclose zero</text>
<text x="275" y="608" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">account or financial access</text>
</g>
<g id="AP06-u" data-kind="action">
