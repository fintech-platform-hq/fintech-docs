<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME11 · Authoritative submission outcome</text>
<line x1="702" y1="101" x2="702" y2="644" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
