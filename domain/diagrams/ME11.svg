<g id="ME11-05" data-from="p" data-to="r"><path d="M 470 262 H 594 V 476 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,476 479,472 479,480" fill="#536783"/><rect x="597" y="353" width="22" height="16" rx="3" fill="#fff"/><text x="599" y="366" fill="#536783" font-size="12" font-weight="700" text-anchor="start">05</text></g>
