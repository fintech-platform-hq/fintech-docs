<g id="ME11-07" data-from="r" data-to="r"><path d="M 470 465 H 550 V 487 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,487 479,483 479,491" fill="#536783"/><rect x="553" y="460" width="22" height="16" rx="3" fill="#fff"/><text x="555" y="473" fill="#536783" font-size="12" font-weight="700" text-anchor="start">07</text></g>
<g id="ME11-08" data-from="c" data-to="c"><path d="M 470 353 H 572 V 375 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,375 479,371 479,379" fill="#536783"/><rect x="575" y="348" width="22" height="16" rx="3" fill="#fff"/><text x="577" y="361" fill="#536783" font-size="12" font-weight="700" text-anchor="start">08</text></g>
<g id="ME11-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME11-p" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">No definitive outcome</text>
</g>
<g id="ME11-c" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Confirmed</text>
</g>
<g id="ME11-r" data-kind="state">
<rect x="80" y="452" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="481" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Definitively rejected</text>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Present protected intent</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Validate scope and terms. The model does not require a stored pending state.</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Confirm effect</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">First send or explicit eligible resubmission with no canonical result revalidates</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">body, scope, revision and barrier. Commit effect, trail, revision and receipt once.</text>
<text x="739" y="246" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Reply loss leaves commitment unchanged.</text>
<text x="725" y="277" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Find canonical receipt</text>
<text x="739" y="297" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Verify original effect or pair and authorized disclosure before fresh execution</text>
<text x="739" y="316" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">guards.</text>
<text x="725" y="347" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Lookup remains inconclusive</text>
<text x="739" y="367" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Read only, zero writes and no inferred rejection.</text>
<text x="725" y="398" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Prove definitive rejection</text>
<text x="739" y="418" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Prove no earlier commitment. Retain facts, trail and revision. Human review may</text>
<text x="739" y="437" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">prepare another intent.</text>
<text x="725" y="468" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Replay compatibly</text>
<text x="739" y="488" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Validate holder, environment, target and terms. Subject to privacy and scope,</text>
<text x="739" y="507" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">return original receipt before fresh guards and do not re-execute.</text>
<text x="725" y="538" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Recover original rejection</text>
<text x="739" y="558" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Return the authorized no-effect result for this original.</text>
<text x="725" y="589" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Replay incompatibly</text>
<text x="739" y="609" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Conflict without disclosure of another result or mutation of the original.</text>
</g></svg>
