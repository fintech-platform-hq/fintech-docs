<text x="275" y="228" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Account holder</text>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Request purpose-specific proof or choose a usable</text>
<text x="275" y="272" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">method</text>
</g>
<g id="AP02-e" data-kind="action">
<rect x="80" y="319" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="340" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Return neutral recovery response. Issue proof only</text>
<text x="275" y="384" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">when eligible</text>
</g>
<g id="AP02-v" data-kind="decision">
<path d="M275 460 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="468" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Valid unused proof for this</text>
<text x="249" y="484" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">holder and purpose?</text>
<text x="249" y="450" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP02-c" data-kind="action">
<rect x="80" y="543" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="564" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="593" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Consume proof and commit verification or access</text>
<text x="275" y="608" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">recovery for the same holder</text>
</g>
<g id="AP02-t" data-kind="action">
<rect x="80" y="655" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="676" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="705" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Recheck scope after verification. After recovery</text>
<text x="275" y="720" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">return to sign-in</text>
</g>
<g id="AP02-r" data-kind="action">
<rect x="80" y="767" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="788" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="817" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Keep access guard and offer eligible proof. Zero</text>
<text x="275" y="832" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">usable methods remains LAC-01</text>
</g>
