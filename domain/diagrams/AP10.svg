<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Owned current calculable check with identifiable evidence?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Yes]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Owned current calculable check with identifiable evidence?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[No, including conflicting reference]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Confirm an existing candidate as the same fact?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Existing expense]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Confirm an existing candidate as the same fact?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Distinct expense or deferral]</text>
<text x="725" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Expense effective at cutoff and pair eligible?</text>
<text x="739" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Open with evidence, or match with nonzero original and proved contribution]</text>
<text x="725" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Expense effective at cutoff and pair eligible?</text>
<text x="739" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Zero original, missing match contribution or incompatible pair or proof]</text>
<text x="725" y="443" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Open discrepancy and valid distinct fact at cutoff?</text>
<text x="739" y="463" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Identifiable nonduplicate in coverage, confirmation requested]</text>
<text x="725" y="494" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">11  Open discrepancy and valid distinct fact at cutoff?</text>
<text x="739" y="514" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Match, outside cutoff, insufficient proof or defer]</text>
</g></svg>
