<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Opened in an authorized context of this holder?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Valid origin and session]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Opened in an authorized context of this holder?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Expired, different holder or unavailable]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Is exposure still authorized?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Session, holder and privacy transition allow]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Is exposure still authorized?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Background, app switcher, expiration or holder changed]</text>
<text x="725" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Return to the originating context?</text>
<text x="739" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Return]</text>
<text x="725" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Return to the originating context?</text>
<text x="739" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Read a group or choose an applicable action]</text>
<text x="725" y="443" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Is the origin still authorized?</text>
<text x="739" y="463" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Same revalidated context]</text>
<text x="725" y="494" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Is the origin still authorized?</text>
<text x="739" y="514" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Context changed or expired]</text>
