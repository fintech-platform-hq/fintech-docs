<title id="titulo">ME04 · Verification or recovery proof</title>
<rect width="1430" height="658" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="48" y="36" fill="#526f83" font-size="14" font-weight="700" text-anchor="start">LENVER / MF03.1     STATE MACHINE</text>
<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME04 · Verification or recovery proof</text>
<line x1="702" y1="101" x2="702" y2="620" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
<g id="ME04-01" data-from="i" data-to="p"><path d="M 275 153 V 223" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,228 271,219 279,219" fill="#12605c"/><rect x="284" y="187" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="200" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">01</text></g>
<g id="ME04-02" data-from="p" data-to="c"><path d="M 275 276 V 335" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,340 271,331 279,331" fill="#12605c"/><rect x="284" y="299" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="312" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">02</text></g>
