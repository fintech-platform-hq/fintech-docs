<g id="ME04-04" data-from="p" data-to="p"><path d="M 470 241 H 506 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="509" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="511" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">04</text></g>
<g id="ME04-05" data-from="c" data-to="f"><path d="M 470 370 H 550 V 588 H 293" fill="none" stroke="#536783" stroke-width="2" /><polygon points="288,588 297,584 297,592" fill="#536783"/><rect x="553" y="463" width="22" height="16" rx="3" fill="#fff"/><text x="555" y="476" fill="#536783" font-size="12" font-weight="700" text-anchor="start">05</text></g>
<g id="ME04-06" data-from="e" data-to="f"><path d="M 275 500 V 569" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,574 271,565 279,565" fill="#12605c"/><rect x="284" y="523" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="536" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">06</text></g>
<g id="ME04-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME04-p" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Proof pending</text>
</g>
<g id="ME04-c" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Consumed</text>
</g>
<g id="ME04-e" data-kind="state">
<rect x="80" y="452" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="481" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Expired</text>
</g>
<g id="ME04-f" data-kind="final">
<circle cx="275" cy="588" r="12" fill="#ffffff" stroke="#162d43" stroke-width="2"/>
<circle cx="275" cy="588" r="7" fill="#162d43"/>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Request proof</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Limit proof to eligible holder, method and purpose. Recovery response is neutral.</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Present proof</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Valid, unexpired, unused, holder- and purpose-bound proof commits with the action.</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">If recovering, validate new password and return to sign-in for the same holder.</text>
<text x="725" y="258" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Expire proof</text>
<text x="739" y="278" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No verification or recovery effect.</text>
<text x="725" y="309" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Reject presentation</text>
<text x="739" y="329" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Invalid, used, mismatched or unauthorized proof leaves pending state.</text>
<text x="725" y="360" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  End consumed lifecycle</text>
<text x="739" y="380" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Refuse reuse. Retention and affected session policy belong to contract design.</text>
<text x="725" y="411" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  End expired lifecycle</text>
<text x="739" y="431" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Preserve expiry and no effect. Reissued proof starts a separate lifecycle.</text>
</g></svg>
