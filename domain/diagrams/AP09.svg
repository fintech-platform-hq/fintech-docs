<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Cutoff, coverage, amount and target allow preview?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Yes, all relevant facts classify unambiguously]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Cutoff, coverage, amount and target allow preview?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Ambiguity or other ineligibility]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Can precision of an existing fact resolve the cutoff?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Yes, CU-019 through AP08]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Can precision of an existing fact resolve the cutoff?</text>
