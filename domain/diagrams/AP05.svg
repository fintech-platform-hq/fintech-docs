<text x="275" y="1713" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Keep uncertainty and query through the protected</text>
<text x="275" y="1728" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">proof in AP06</text>
