<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Explicitly confirmed?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Confirmation and valid reauthentication]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Explicitly confirmed?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Canceled or reauthentication missing]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Protected original lookup authority established?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Proof available before send]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Protected original lookup authority established?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[No usable proof]</text>
<text x="725" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Eligible at the acceptance barrier?</text>
<text x="739" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Compatible account and proof, admission open]</text>
<text x="725" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Eligible at the acceptance barrier?</text>
<text x="739" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Definitive rejection of original]</text>
<text x="725" y="443" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">14  Authoritative response for this original received?</text>
<text x="739" y="463" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Original result demonstrated]</text>
<text x="725" y="494" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">15  Authoritative response for this original received?</text>
<text x="739" y="514" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Absent or inconclusive on either branch]</text>
</g></svg>
