<text x="249" y="898" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP05-b" data-kind="action">
<rect x="80" y="991" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="1012" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="1041" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Accept and close admission together. Include prior</text>
<text x="275" y="1056" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">commits and reject later incompatible effects</text>
</g>
<g id="AP05-r" data-kind="action">
<rect x="80" y="1103" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="1124" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="1153" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Preserve prior admission and record recoverable</text>
<text x="275" y="1168" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">rejection without effect</text>
</g>
<g id="AP05-d" data-kind="action">
