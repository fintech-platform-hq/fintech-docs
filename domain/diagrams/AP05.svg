<text x="275" y="1236" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="1265" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Coordinate sessions, data, local disposal and</text>
<text x="275" y="1280" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Apple. Record progress, partial or completion</text>
</g>
