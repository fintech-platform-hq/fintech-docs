<text x="275" y="676" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="705" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Stop before sending. Preserve access and data and</text>
