<text x="275" y="1572" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="1601" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Show only request status. Completion requires</text>
<text x="275" y="1616" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">proof of all applicable effects</text>
</g>
