<text x="734" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Is this an outcome lookup for a management act?</text>
<text x="748" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Read-only lookup]</text>
<text x="734" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Is this an outcome lookup for a management act?</text>
<text x="748" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[New act]</text>
<text x="734" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Authorized for original act and method?</text>
<text x="748" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Authenticated holder with outcome authority]</text>
<text x="734" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Authorized for original act and method?</text>
<text x="748" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Missing or different scope]</text>
<text x="734" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Applicable password change?</text>
<text x="748" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Usable password method]</text>
<text x="734" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Applicable password change?</text>
<text x="748" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Voluntary unlinking]</text>
<text x="734" y="443" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Valid contextual proof and proposed password at commitment?</text>
<text x="748" y="463" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Correct holder and method, current proof and confirmation]</text>
<text x="734" y="494" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Valid contextual proof and proposed password at commitment?</text>
<text x="748" y="514" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Canceled, invalid, expired or refused]</text>
<text x="734" y="545" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">13  Outcome demonstrated?</text>
<text x="748" y="565" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Authorized confirmation or refusal]</text>
<text x="734" y="596" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">14  Outcome demonstrated?</text>
<text x="748" y="616" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Missing or incomplete response]</text>
</g></svg>
