<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="658" viewBox="0 0 1430 658" role="img" aria-labelledby="titulo">
<title id="titulo">ME05 · Lenver session and authority</title>
<rect width="1430" height="658" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="48" y="36" fill="#526f83" font-size="14" font-weight="700" text-anchor="start">LENVER / MF03.1     STATE MACHINE</text>
<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME05 · Lenver session and authority</text>
<line x1="702" y1="101" x2="702" y2="620" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
<g id="ME05-01" data-from="i" data-to="a"><path d="M 275 153 V 223" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,228 271,219 279,219" fill="#12605c"/><rect x="284" y="187" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="200" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">01</text></g>
<g id="ME05-02" data-from="a" data-to="a"><path d="M 470 241 H 506 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="509" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="511" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">02</text></g>
<g id="ME05-03" data-from="a" data-to="r"><path d="M 470 262 H 528 V 476 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,476 479,472 479,480" fill="#536783"/><rect x="531" y="353" width="22" height="16" rx="3" fill="#fff"/><text x="533" y="366" fill="#536783" font-size="12" font-weight="700" text-anchor="start">03</text></g>
<g id="ME05-04" data-from="a" data-to="e"><path d="M 275 276 V 335" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,340 271,331 279,331" fill="#12605c"/><rect x="284" y="299" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="312" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">04</text></g>
<g id="ME05-05" data-from="e" data-to="f"><path d="M 470 370 H 550 V 588 H 293" fill="none" stroke="#536783" stroke-width="2" /><polygon points="288,588 297,584 297,592" fill="#536783"/><rect x="553" y="463" width="22" height="16" rx="3" fill="#fff"/><text x="555" y="476" fill="#536783" font-size="12" font-weight="700" text-anchor="start">05</text></g>
<g id="ME05-06" data-from="r" data-to="f"><path d="M 275 500 V 569" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,574 271,565 279,565" fill="#12605c"/><rect x="284" y="523" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="536" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">06</text></g>
<g id="ME05-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME05-a" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Authorized session</text>
</g>
<g id="ME05-e" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Expired</text>
</g>
<g id="ME05-r" data-kind="state">
<rect x="80" y="452" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="481" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Revoked</text>
</g>
<g id="ME05-f" data-kind="final">
<circle cx="275" cy="588" r="12" fill="#ffffff" stroke="#162d43" stroke-width="2"/>
<circle cx="275" cy="588" r="7" fill="#162d43"/>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Complete authentication</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Resolve holder, proof and account admission. Grant the scoped session and consume</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">one-use Apple proof where applicable.</text>
<text x="725" y="207" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Accept refresh</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Valid renewable authority retains the holder and scope. Password financial</text>
<text x="739" y="246" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">verification remains a guard.</text>
<text x="725" y="277" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Confirm revocation</text>
<text x="739" y="297" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">End remote authority on confirmed revocation. Local sign-out hides data and does</text>
<text x="739" y="316" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">not cancel an uncertain write.</text>
<text x="725" y="347" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Expire session</text>
<text x="739" y="367" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Block use and require fresh access proof.</text>
<text x="725" y="398" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  End expired session</text>
<text x="739" y="418" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Keep the expired session unauthorized. Authorized re-entry creates a new session.</text>
<text x="725" y="449" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  End revoked session</text>
<text x="739" y="469" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Retain revocation. Re-entry requires fresh authentication and open admission.</text>
</g></svg>
