<g id="ME09-s" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Superseded check</text>
