<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Confirm observation</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Explicit amount, eligible unambiguous cutoff and current preview freeze amount,</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">author, recording time, cutoff and original under a new ID. Zero transactions.</text>
<text x="725" y="207" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Replace</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G06/G09 require eligible new observation, later revision and no successor. Preserve</text>
<text x="739" y="246" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">predecessor, links and separate edge reason.</text>
<text x="725" y="277" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Refuse second replacement</text>
<text x="739" y="297" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No branch, stale proposal returns to review. Compatible replay belongs to ME11.</text>
</g></svg>
