<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="434" viewBox="0 0 1430 434" role="img" aria-labelledby="titulo">
<title id="titulo">ME03 · Password email verification</title>
<rect width="1430" height="434" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="48" y="36" fill="#526f83" font-size="14" font-weight="700" text-anchor="start">LENVER / MF03.1     STATE MACHINE</text>
<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME03 · Password email verification</text>
<line x1="702" y1="101" x2="702" y2="396" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
<g id="ME03-01" data-from="i" data-to="p"><path d="M 275 153 V 223" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,228 271,219 279,219" fill="#12605c"/><rect x="284" y="187" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="200" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">01</text></g>
<g id="ME03-02" data-from="p" data-to="v"><path d="M 275 276 V 335" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,340 271,331 279,331" fill="#12605c"/><rect x="284" y="299" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="312" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">02</text></g>
<g id="ME03-03" data-from="p" data-to="p"><path d="M 470 241 H 506 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="509" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="511" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">03</text></g>
<g id="ME03-04" data-from="v" data-to="v"><path d="M 470 353 H 528 V 375 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,375 479,371 479,379" fill="#536783"/><rect x="531" y="348" width="22" height="16" rx="3" fill="#fff"/><text x="533" y="361" fill="#536783" font-size="12" font-weight="700" text-anchor="start">04</text></g>
<g id="ME03-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME03-p" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Verification pending</text>
</g>
<g id="ME03-v" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Control verified</text>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Establish password method</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Keep financial reads and writes restricted through password pending verification.</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Prove contact control</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Consume valid proof for this holder and scope and recheck financial authorization.</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Reject proof or fail to read status</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Invalid, consumed, expired, foreign or unconfirmed proof preserves the password</text>
<text x="739" y="278" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">restriction. Apple has its own proof.</text>
<text x="725" y="309" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Repeat proof</text>
<text x="739" y="329" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Already used proof produces no new effect and grants no authority to another</text>
<text x="739" y="348" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">identity.</text>
</g></svg>
