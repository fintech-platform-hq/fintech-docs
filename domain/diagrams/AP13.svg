<g id="AP13-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
<text x="255" y="146" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Entry</text>
</g>
<g id="AP13-s" data-kind="action">
<rect x="80" y="207" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="228" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Capture session, holder, account, filters, cutoff</text>
<text x="275" y="272" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">and expected revision</text>
</g>
<g id="AP13-v" data-kind="decision">
<path d="M275 348 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="356" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Read authorized for holder</text>
<text x="249" y="372" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">and account?</text>
<text x="249" y="338" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Lenver authority</text>
</g>
<g id="AP13-q" data-kind="action">
<rect x="80" y="431" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="452" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Lenver authority</text>
<text x="275" y="481" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Produce coherent response bound to request and</text>
<text x="275" y="496" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">revision</text>
</g>
<g id="AP13-g" data-kind="decision">
<path d="M275 572 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="580" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Response valid immediately</text>
<text x="249" y="596" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">before presentation?</text>
<text x="249" y="562" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Client</text>
</g>
<g id="AP13-l" data-kind="action">
<rect x="80" y="655" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="676" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="705" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Present data or confirmed empty. Preserve</text>
<text x="275" y="720" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">originals and suppress unavailable amounts</text>
</g>
<g id="AP13-j" data-kind="decision">
<path d="M275 796 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="804" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">Is prior reading still</text>
<text x="249" y="820" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">authorized, valid and</text>
<text x="249" y="836" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">traceable in current</text>
<text x="249" y="852" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">context?</text>
<text x="249" y="786" fill="#556982" font-size="12" font-weight="700" text-anchor="end">Client</text>
</g>
<g id="AP13-d" data-kind="action">
<rect x="80" y="879" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="900" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="929" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Show as stale with reference. Restart incompatible</text>
<text x="275" y="944" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">pages retaining authorized filters</text>
</g>
<g id="AP13-m_r" data-kind="merge">
<path d="M275 1020 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="1010" fill="#556982" font-size="12" font-weight="700" text-anchor="end"></text>
</g>
<g id="AP13-r" data-kind="action">
<rect x="80" y="1103" width="390" height="90" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="1124" fill="#526f83" font-size="12" font-weight="700" text-anchor="middle">Client</text>
<text x="275" y="1146" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Discard late response and suppress affected</text>
<text x="275" y="1161" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">content. Distinguish error, expiry and</text>
<text x="275" y="1176" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">unavailability</text>
</g>
<g id="AP13-m_z" data-kind="merge">
<path d="M275 1244 l16 16 -16 16 -16 -16 Z" fill="#fff4d4" stroke="#805d19" stroke-width="2"/>
<text x="249" y="1234" fill="#556982" font-size="12" font-weight="700" text-anchor="end"></text>
</g>
<g id="AP13-z" data-kind="final">
<circle cx="275" cy="1372" r="12" fill="#ffffff" stroke="#162d43" stroke-width="2"/>
<circle cx="275" cy="1372" r="7" fill="#162d43"/>
<text x="255" y="1378" fill="#162d43" font-size="14" font-weight="400" text-anchor="end">End</text>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Read authorized for holder and account?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Yes]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Read authorized for holder and account?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Denied or invalid session]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Response valid immediately before presentation?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Compatible scope, filters, cutoff and revision. No known invalidation]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Response valid immediately before presentation?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Failure, changed context or known invalidation]</text>
<text x="725" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Is prior reading still authorized, valid and traceable in current context?</text>
<text x="739" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Revalidated before display]</text>
<text x="725" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Is prior reading still authorized, valid and traceable in current context?</text>
<text x="739" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Invalid, unauthorized or unknown origin]</text>
</g></svg>
