<text x="756" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Choose deletion</text>
<text x="770" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Review consequences in the authorized account.</text>
<text x="756" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Prepare protected request</text>
<text x="770" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Establish pre-network lookup authority bound to original, holder and</text>
<text x="770" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">environment. No account access is granted.</text>
<text x="756" y="258" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Cancel or fail preparation</text>
<text x="770" y="278" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No accepted request. Distinguish cancel from failed protection.</text>
<text x="756" y="309" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Cancel protected preparation</text>
<text x="770" y="329" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No network and no accepted deletion.</text>
<text x="756" y="360" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Submit protected original</text>
<text x="770" y="380" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Require reauthentication, explicit consent and original lookup authority.</text>
<text x="770" y="399" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Submit only the original and keep uncertainty on reply loss.</text>
<text x="756" y="430" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Accept</text>
<text x="770" y="450" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Validate holder and admission. Accept and close admission together with ME01.</text>
<text x="770" y="469" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Include earlier commits and deny later incompatible effects.</text>
<text x="756" y="500" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Reject</text>
<text x="770" y="520" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Demonstrate no effect of original and preserve existing admission.</text>
<text x="756" y="551" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Record pending work</text>
<text x="770" y="571" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Revocation or disposal remains unresolved. Expose partial outcome via protected</text>
<text x="770" y="590" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">proof.</text>
<text x="756" y="621" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Resume work</text>
<text x="770" y="641" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Coordinate outstanding effects without repeating completed effects or reopening</text>
<text x="770" y="660" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">admission.</text>
<text x="756" y="691" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Complete in-progress handling</text>
<text x="770" y="711" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">All applicable effects are demonstrated and retention justified. Record minimum</text>
<text x="770" y="730" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">completion for the original.</text>
<text x="756" y="761" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">11  Resolve last partial item</text>
<text x="770" y="781" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Complete after proving all applicable effects and justifying retention.</text>
<text x="770" y="800" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Preserve original scope.</text>
<text x="756" y="831" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">12  Lookup before a result is available</text>
<text x="770" y="851" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Validate original proof. Preserve uncertainty and perform no new request.</text>
<text x="756" y="882" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">13  Lookup in progress</text>
<text x="770" y="902" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Reveal only the minimal authorized original status.</text>
<text x="756" y="933" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">14  Lookup partial</text>
<text x="770" y="953" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Reveal the original partial state, no account information.</text>
<text x="756" y="984" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">15  Lookup rejected</text>
<text x="770" y="1004" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Reveal definitive original rejection under proof.</text>
<text x="756" y="1035" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">16  Lookup completed</text>
<text x="770" y="1055" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Reveal demonstrated completion with no account access.</text>
</g></svg>
