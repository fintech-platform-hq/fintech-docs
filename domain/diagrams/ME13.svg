</g>
<g id="ME13-x" data-kind="final">
<circle cx="275" cy="476" r="12" fill="#ffffff" stroke="#162d43" stroke-width="2"/>
<circle cx="275" cy="476" r="7" fill="#162d43"/>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Receive reading</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">At publication revalidate session, holder, account, filters, cutoff, revision,</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">origin and known invalidation.</text>
<text x="725" y="207" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Observe newer revision or inconclusive refresh</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Keep only demonstrably valid scoped prior data with reference and stale indicator.</text>
<text x="725" y="258" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Verify refreshed reading</text>
<text x="739" y="278" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Publish compatible current response, including confirmed empty.</text>
<text x="725" y="309" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Withdraw current reading</text>
<text x="739" y="329" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Session, holder, account, filters, revision, privacy transition or known</text>
<text x="739" y="348" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">invalidation suppress affected content and incompatible pages.</text>
<text x="725" y="379" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Withdraw prior reading</text>
<text x="739" y="399" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Invalid scope or figure suppresses stale reading and late response.</text>
</g></svg>
