<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Refining an existing occurrence?</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[CU-019 refinement]</text>
<text x="725" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Refining an existing occurrence?</text>
<text x="739" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Create, correct or invalidate]</text>
<text x="725" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Eligible refinement including during suspension?</text>
<text x="739" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Unambiguous nonfuture instant in original interval, other terms preserved]</text>
<text x="725" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Eligible refinement including during suspension?</text>
<text x="739" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Authority or precision proof missing]</text>
<text x="725" y="341" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Authorized change with baseline available where required?</text>
<text x="739" y="361" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Eligible BRL and occurrence, G09 on correction]</text>
<text x="725" y="392" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Authorized change with baseline available where required?</text>
<text x="739" y="412" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">[Ambiguous or incompatible target or baseline]</text>
</g></svg>
