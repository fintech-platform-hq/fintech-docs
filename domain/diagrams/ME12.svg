<text x="822" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Prepare intent</text>
<text x="836" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Freeze original terms and scope before network.</text>
<text x="822" y="188" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Fail before network</text>
<text x="836" y="208" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No transmission. Allow fixing protection.</text>
<text x="822" y="239" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Protect original terms</text>
<text x="836" y="259" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Persist immutable scoped terms and intent identity.</text>
<text x="822" y="290" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Repair protection</text>
<text x="836" y="310" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Proved no network and successful protection permit an authorized first</text>
<text x="836" y="329" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">send.</text>
<text x="822" y="360" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Restart before send</text>
<text x="836" y="380" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">With zero transmission proved, restore identical terms under the same</text>
<text x="836" y="399" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">holder, environment and target.</text>
<text x="822" y="430" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Submit deliberately</text>
<text x="836" y="450" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Verify context and protection before first transmission.</text>
<text x="822" y="481" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Restart in an indeterminate position</text>
<text x="836" y="501" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Possible transmission preserves uncertainty.</text>
<text x="822" y="532" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Lose response or restart</text>
<text x="836" y="552" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Maintain the same original and uncertainty. Block equivalent writes.</text>
<text x="822" y="583" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">09  Lose original after possible send</text>
<text x="836" y="603" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Prevent equivalent attempt without original proof.</text>
<text x="822" y="634" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">10  Lose local intent while uncertain</text>
<text x="836" y="654" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No implication of no effect.</text>
<text x="822" y="685" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">11  Restore original</text>
<text x="836" y="705" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Check identical terms and scope. Keep uncertainty until proved.</text>
<text x="822" y="736" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">12  Lookup inconclusive or proof expired</text>
<text x="836" y="756" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">No mutation, duplication or demonstrated rejection.</text>
<text x="822" y="787" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">13  Sign out or change scope</text>
<text x="836" y="807" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Isolate original from unauthorized access and keep eligible protected</text>
<text x="836" y="826" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">intent.</text>
<text x="822" y="857" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">14  Explicitly resubmit</text>
<text x="836" y="877" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Require identical protected original, current authority and</text>
<text x="836" y="896" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">eligibility.</text>
<text x="822" y="927" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">15  Prove confirmation</text>
<text x="836" y="947" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Accept demonstrated result for original and refresh separately.</text>
<text x="822" y="978" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">16  Recover confirmation while uncertain</text>
<text x="836" y="998" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Verify canonical result and scope, then refresh separately.</text>
<text x="822" y="1029" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">17  Recover confirmation after local loss</text>
<text x="836" y="1049" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Require independent proof linking original and effect, then refresh</text>
<text x="836" y="1068" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">separately.</text>
<text x="822" y="1099" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">18  Prove rejection</text>
<text x="836" y="1119" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Require definitive no effect for this original before allowing</text>
<text x="836" y="1138" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">preparation of another intent.</text>
<text x="822" y="1169" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">19  Recover rejection while uncertain</text>
<text x="836" y="1189" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Release preparation only with the proved original outcome.</text>
<text x="822" y="1220" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">20  Recover rejection after local loss</text>
<text x="836" y="1240" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Require independently demonstrated no effect for the original.</text>
</g></svg>
