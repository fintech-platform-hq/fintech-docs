</g>
<g id="ME12-r" data-kind="state">
<rect x="80" y="1012" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="1041" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">No-effect rejection known</text>
