<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="529" viewBox="0 0 1430 529" role="img" aria-labelledby="titulo">
<title id="titulo">ME10 · Recovery link</title>
<rect width="1430" height="529" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="48" y="36" fill="#526f83" font-size="14" font-weight="700" text-anchor="start">LENVER / MF03.1     STATE MACHINE</text>
<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME10 · Recovery link</text>
<line x1="702" y1="101" x2="702" y2="491" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
<g id="ME10-01" data-from="i" data-to="v"><path d="M 275 153 V 223" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,228 271,219 279,219" fill="#12605c"/><rect x="284" y="187" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="200" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">01</text></g>
<g id="ME10-02" data-from="v" data-to="r"><path d="M 275 276 V 335" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,340 271,331 279,331" fill="#12605c"/><rect x="284" y="299" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="312" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">02</text></g>
<g id="ME10-03" data-from="r" data-to="v"><path d="M 470 370 H 550 V 252 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,252 479,248 479,256" fill="#536783"/><rect x="553" y="295" width="22" height="16" rx="3" fill="#fff"/><text x="555" y="308" fill="#536783" font-size="12" font-weight="700" text-anchor="start">03</text></g>
<g id="ME10-04" data-from="r" data-to="r"><path d="M 470 353 H 506 V 375 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,375 479,371 479,379" fill="#536783"/><rect x="509" y="348" width="22" height="16" rx="3" fill="#fff"/><text x="511" y="361" fill="#536783" font-size="12" font-weight="700" text-anchor="start">04</text></g>
<g id="ME10-05" data-from="v" data-to="v"><path d="M 470 241 H 528 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="531" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="533" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">05</text></g>
<g id="ME10-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME10-v" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Attributed link</text>
</g>
<g id="ME10-r" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Withdrawn link</text>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Associate</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G04 requires current eligible check, confirmed fact and pair, and compatible</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">identity. Existing-link effect is nonmonetary. Distinct expense and originating</text>
<text x="739" y="195" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">link commit together once. Succession inherits no link.</text>
<text x="725" y="226" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Withdraw</text>
<text x="739" y="246" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09 on the mistaken current pair removes attribution. Keep transaction, evidence,</text>
<text x="739" y="265" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">link, balance and remaining difference.</text>
<text x="725" y="296" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Restore</text>
<text x="739" y="316" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G04/G09 and current proof allow a separate decision and receipt on the same pair.</text>
<text x="739" y="335" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Restore attribution without creating a new link or transaction.</text>
<text x="725" y="366" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Refuse restoration</text>
<text x="739" y="386" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Ineligible proof, changed revision, unavailable baseline or different pair</text>
<text x="739" y="405" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">preserves withdrawal. A different pair needs consent of its own.</text>
<text x="725" y="436" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Refuse duplicate association</text>
<text x="739" y="456" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Preserve link. Eligible replay returns the original result without new effects.</text>
</g></svg>
