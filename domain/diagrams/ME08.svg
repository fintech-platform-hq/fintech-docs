<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="510" viewBox="0 0 1430 510" role="img" aria-labelledby="titulo">
<title id="titulo">ME08 · Transaction and versions</title>
<rect width="1430" height="510" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="48" y="36" fill="#526f83" font-size="14" font-weight="700" text-anchor="start">LENVER / MF03.1     STATE MACHINE</text>
<text x="48" y="76" fill="#162d43" font-size="30" font-weight="700" text-anchor="start">ME08 · Transaction and versions</text>
<line x1="702" y1="101" x2="702" y2="472" stroke="#d9e4ed"/>
<text x="725" y="106" fill="#162d43" font-size="17" font-weight="700" text-anchor="start">Transitions · event, conditions and outcome</text>
<g id="ME08-01" data-from="i" data-to="v"><path d="M 275 153 V 223" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,228 271,219 279,219" fill="#12605c"/><rect x="284" y="187" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="200" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">01</text></g>
<g id="ME08-02" data-from="v" data-to="v"><path d="M 470 241 H 506 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="509" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="511" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">02</text></g>
<g id="ME08-03" data-from="v" data-to="v"><path d="M 470 241 H 528 V 263 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,263 479,259 479,267" fill="#536783"/><rect x="531" y="236" width="22" height="16" rx="3" fill="#fff"/><text x="533" y="249" fill="#536783" font-size="12" font-weight="700" text-anchor="start">03</text></g>
<g id="ME08-04" data-from="v" data-to="x"><path d="M 275 276 V 335" fill="none" stroke="#12605c" stroke-width="2" /><polygon points="275,340 271,331 279,331" fill="#12605c"/><rect x="284" y="299" width="22" height="16" rx="3" fill="#fff"/><text x="286" y="312" fill="#12605c" font-size="12" font-weight="700" text-anchor="start">04</text></g>
<g id="ME08-05" data-from="x" data-to="x"><path d="M 470 353 H 550 V 375 H 475" fill="none" stroke="#536783" stroke-width="2" /><polygon points="470,375 479,371 479,379" fill="#536783"/><rect x="553" y="348" width="22" height="16" rx="3" fill="#fff"/><text x="555" y="361" fill="#536783" font-size="12" font-weight="700" text-anchor="start">05</text></g>
<g id="ME08-i" data-kind="initial">
<circle cx="275" cy="140" r="12" fill="#162d43" stroke="#162d43" stroke-width="2"/>
</g>
<g id="ME08-v" data-kind="state">
<rect x="80" y="228" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="257" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Valid transaction</text>
</g>
<g id="ME08-x" data-kind="state">
<rect x="80" y="340" width="390" height="48" rx="13" fill="#eff6fa" stroke="#355a71" stroke-width="2"/>
<text x="275" y="369" fill="#162d43" font-size="15" font-weight="400" text-anchor="middle">Invalidated transaction</text>
</g>
<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Confirm transaction</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G01–G03 and applicable recovery proof. Preserve original and commit originating</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">link together when applicable.</text>
<text x="725" y="207" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Correct</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09 and valid terms allow versioning at the current revision with coherent balance</text>
<text x="739" y="246" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">and cutoff impact. Preserve original identity, currency and type.</text>
<text x="725" y="277" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Refine</text>
<text x="739" y="297" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09 and a proved nonfuture instant in the original interval allow precision-only</text>
<text x="739" y="316" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">versioning. Preserve suspension and obtain a new dependent preview.</text>
<text x="725" y="347" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Invalidate</text>
<text x="739" y="367" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09 and eligible target remove current contribution. Retain identity, audit and</text>
<text x="739" y="386" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">originals.</text>
<text x="725" y="417" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Refuse new mutation</text>
<text x="739" y="437" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Incompatible target state preserves original and invalidation.</text>
</g></svg>
