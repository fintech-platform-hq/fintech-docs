<text x="725" y="137" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">01  Assess financial context</text>
<text x="739" y="157" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Verify authorized new or legacy context without a baseline. A new account may not</text>
<text x="739" y="176" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">exist yet. Preserve readable legacy history.</text>
<text x="725" y="207" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">02  Establish baseline</text>
<text x="739" y="227" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Eligible preview and commitment. New account and terms commit together or</text>
<text x="739" y="246" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">authorized adoption preserves IDs and pre-coverage history.</text>
<text x="725" y="277" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">03  Reject or defer opening</text>
<text x="739" y="297" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Preserve prior history and unavailable amounts. Legacy requires ownership,</text>
<text x="739" y="316" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">integrity and compatible writers.</text>
<text x="725" y="347" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">04  Suspend</text>
<text x="739" y="367" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09 requires reason and reauthentication. Retain terms and originals, suppress</text>
<text x="739" y="386" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">calculations and dependent writes.</text>
<text x="725" y="417" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">05  Correct active terms</text>
<text x="739" y="437" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09, corresponding declaration and unambiguous fresh preview produce audited new</text>
<text x="739" y="456" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">version.</text>
<text x="725" y="487" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">06  Restore from suspension</text>
<text x="739" y="507" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G09 and resolved boundaries allow new terms and only eligible figures.</text>
<text x="725" y="538" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">07  Refine existing occurrence</text>
<text x="739" y="558" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">G03/G09 allow precision-only change. Keep suspension and replace dependent preview.</text>
<text x="725" y="589" fill="#162d43" font-size="15" font-weight="700" text-anchor="start">08  Refuse new opening while suspended</text>
<text x="739" y="609" fill="#162d43" font-size="15" font-weight="400" text-anchor="start">Use correction rather than a second baseline.</text>
</g></svg>
